[package]
name = "tauri-app"
version = "1.1.0"
description = "Local-first inventory for AI agent assets across Claude Code, Codex, and Gemini CLI"
authors = ["Karthik Rajendran"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"
ignore = "0.4"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
notify = "6.0"
blake3 = "1.5"
# Process table only (src/mcp/observe.rs). default-features pulls in disk,
# network, component and user probes this app never reads.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
similar = { version = "2.5", features = ["inline"] }
tokio = { version = "1", features = ["full"] }
# Already resolved transitively via tokio (0.2.186 in Cargo.lock); named
# explicitly because src/mcp/probe.rs calls libc::kill directly to send a
# probed server SIGTERM before escalating to SIGKILL.
libc = "0.2"
tempfile = "3.10"
rusqlite = { version = "0.31", features = ["bundled"] }
sentry = "0.34"
reqwest = { version = "0.12", features = ["json", "blocking"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
tauri-plugin-log = "2.9.0"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-mcp-bridge = "0.12"

# AppKit access for the dev-only Dock icon override (see src/dev_icon.rs).
# Already in the tree via tauri; naming them here just makes them reachable.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
